name: Build latest episodes

# Pre-builds the newest N "AEE nnnn" episodes from the official RSS feed and commits the
# extracted practice data (items + short context sentences + timestamps only) to data/.
on:
  schedule:
    - cron: '17 11 * * *' # daily, ~04:17 Pacific
  workflow_dispatch:
    inputs:
      count:
        description: How many of the newest episodes to make sure are built
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pipeline

      - name: Build newest episodes
        env:
          COUNT: ${{ inputs.count || '10' }}
        run: |
          if ! [[ "$COUNT" =~ ^[0-9]{1,2}$ ]]; then echo "count must be a number (1-99)"; exit 1; fi
          python -m pipeline.build --latest "$COUNT" --skip-existing

      - name: Validate published data
        run: python -m pytest -q tests/test_published_json.py tests/test_promo.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: build latest episodes"
          git pull --rebase
          git push

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
