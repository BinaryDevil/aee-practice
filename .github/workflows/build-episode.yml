name: Build episode

# Builds any episode on demand: Actions -> "Build episode" -> Run workflow -> enter the number (e.g. 2670).
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode number(s), e.g. 2670 or "2670 2671"
        required: true
      force:
        description: Rebuild even if the episode already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pipeline

      - name: Build episode
        env:
          EPISODES: ${{ inputs.episode }}
          FORCE: ${{ inputs.force }}
        run: |
          if ! [[ "$EPISODES" =~ ^[0-9]{1,5}([[:space:]]+[0-9]{1,5}){0,9}$ ]]; then
            echo "episode must be one or more episode numbers separated by spaces"; exit 1
          fi
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); else args+=(--skip-existing); fi
          # shellcheck disable=SC2086
          python -m pipeline.build --number $EPISODES "${args[@]}"

      - name: Validate published data
        run: python -m pytest -q tests/test_published_json.py tests/test_promo.py

      - name: Commit data
        env:
          EPISODES: ${{ inputs.episode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: build episode $EPISODES"
          git pull --rebase
          git push

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
