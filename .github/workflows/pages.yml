name: Deploy site to GitHub Pages

# Publishes only the static app: index.html, assets/, data/ (never pipeline caches).
# Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # branch tip, so data committed earlier in this run is included

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
