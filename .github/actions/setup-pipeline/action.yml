name: Set up AEE pipeline
description: Python deps, ffmpeg, and cached lexicons/models (ECDICT, Kaikki mini, opus-mt-en-zh, whisper small.en).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pipeline/requirements*.txt

    - name: Install ffmpeg
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
        fi

    - name: Install Python packages
      shell: bash
      run: python -m pip install -r pipeline/requirements.txt

    # Lexicons + converted MT model are large (~500 MB) and slow to build, so cache them.
    # Bump the "v1" suffix to force a rebuild (e.g. to refresh Wiktionary data).
    - name: Cache lexicons and models
      id: cache-resources
      uses: actions/cache@v4
      with:
        path: |
          .cache/lexicon
          .cache/models
          ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
        key: aee-resources-v1-${{ hashFiles('pipeline/build_kaikki_mini.py', 'pipeline/setup_resources.py') }}

    - name: Install model-conversion packages (only when the MT model must be built)
      if: steps.cache-resources.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # CPU-only torch is a ~200 MB wheel; the default PyPI wheel pulls in CUDA (GBs).
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r pipeline/requirements-convert.txt

    - name: Download / build resources (skips anything already present)
      shell: bash
      run: python -m pipeline.setup_resources
